name: Test and Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'raysnflow*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install and run tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
          pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/raysnflow')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload dist/* -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD"

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload to the GitHub Packages Python registry for this repository owner
          python -m pip install --upgrade twine
          python -m twine upload --repository-url https://pypi.pkg.github.com/${{ github.repository_owner }} dist/* -u "$TWINE_USERNAME" -p "$TWINE_PASSWORD"
